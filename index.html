<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuphead Training App</title>
    <link rel="stylesheet" href="style.css?v=icon-accents">
</head>
<body data-page="personal-times">

<div class="pages">
    <div class="training-table-brand">
        <details class="game-picker" id="game-picker"><summary></summary><div class="game-choices"></div></details>
        <h1 class="training-table-title" data-i18n="ui.training-table-title">Speedrunning training table</h1>
    </div>
    <a href="info.html" class="info-nav-btn" data-i18n-aria-label="ui.info-aria" aria-label="How it works">&#9432;</a>

    <button id="lang-toggle-btn" class="lang-toggle-btn-inline" type="button" onclick="setActiveLanguage(getActiveLanguage() === 'pt-BR' ? 'en' : 'pt-BR')" data-i18n-aria-label="ui.language-aria" aria-label="Toggle language">
        <img src="https://flagcdn.com/w40/us.png" srcset="https://flagcdn.com/w80/us.png 2x" alt="English" width="28" height="21">
    </button>
</div>

<div class="nav-row">
    <div class="page-tabs">
            <a href="index.html" class="active" data-i18n="nav.enter-times">Enter Times</a>
        <a href="index2.html" data-i18n="nav.time-table">Time Table</a>
    </div>
</div>

    <div id="category-tabs" class="category-tabs"></div>

    <div class="board-layout">
        <div class="scroll-wrapper">
            <div id="table"></div>
            <div id="totals"></div>
        </div>
        <div class="rank-chart-column">
            <aside id="rank-chart" class="rank-chart"></aside>
            <div id="rank-chart-pie" class="rank-chart-pie-shell"></div>
        </div>
    </div>

    <div class="data-controls">
        <button id="export-btn" class="data-control-btn" type="button" data-i18n="nav.export">Export Times</button>
        <button id="import-btn" class="data-control-btn" type="button" data-i18n="nav.import">Import Times</button>
        <input id="import-file" type="file" accept=".json,application/json" hidden>
    </div>

    <script src="js/sound-effects.js"></script>
    <script src="js/game-toggle.js?v=steam-banner-picker"></script>
<script src="data.js?v=silksong-saturation"></script>
    <script src="js/state.js?v=game-selection"></script>
    <script src="js/time.js"></script>
    <script src="js/category.js?v=game-selection"></script>
    <script src="js/data-access.js"></script>
    <script src="js/ranks.js?v=wheel-ranks"></script>
    <script src="js/calculations.js?v=game-selection"></script>
    <script src="js/wr-times.js"></script>
    <script src="js/storage.js?v=game-selection"></script>
    <script src="js/render-time-table.js?v=game-selection"></script>
    <script src="js/render-personal.js?v=game-selection"></script>
    <script src="js/render.js?v=silksong-warm-splits"></script>
    <script src="js/language.js?v=compact-game-banner"></script>
    <script src="js/main.js?v=game-selection"></script>

</body>
</html>
