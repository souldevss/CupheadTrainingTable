<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuphead Training Table</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="personal-times">

    <div class="pages">
        <h1 id="bigtitle">Cuphead Training Table</h1>
        <a href="index.html" class="active" data-page-link="personal">Enter times</a>
        <a href="index2.html" data-page-link="time-table">Time Table</a>
    </div>

    <div id="category-tabs" class="category-tabs"></div>

    <div class="data-controls">
        <button id="export-btn" class="data-control-btn" type="button">
            <span>⬇ Export Times</span>
        </button>
        <button id="import-btn" class="data-control-btn" type="button">
            <span>⬆ Import Times</span>
        </button>
        <input id="import-file" type="file" accept=".json" style="display: none;">
    </div>

    <div class="board-layout">
        <div class="scroll-wrapper">
            <div id="table"></div>
            <div id="totals"></div>
        </div>
        <div class="rank-chart-column">
            <aside id="rank-chart" class="rank-chart"></aside>
            <div id="rank-chart-pie" class="rank-chart-pie-shell"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="js/state.js"></script>
    <script src="js/time.js"></script>
    <script src="js/category.js"></script>
    <script src="js/data-access.js"></script>
    <script src="js/ranks.js"></script>
    <script src="js/calculations.js"></script>
    <script src="js/wr-times.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/render-time-table.js"></script>
    <script src="js/render-personal.js"></script>
    <script src="js/render.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
